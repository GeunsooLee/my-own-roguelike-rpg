<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Own Roguelike RPG — Terms of Service &amp; Privacy Policy</title>
<meta name="robots" content="noindex" />
<script>
  (function () {
    var supported = ["ko", "en", "ja", "zh_cn", "zh_tw", "de", "fr", "es", "pt_br", "ru"];
    function pick() {
      var q = new URLSearchParams(location.search).get("lang");
      if (q && supported.indexOf(q) >= 0) return q;
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i]).toLowerCase();
        if (l.indexOf("ko") === 0) return "ko";
        if (l.indexOf("ja") === 0) return "ja";
        if (l === "zh-tw" || l === "zh-hk" || l === "zh-mo" || l.indexOf("zh-hant") === 0) return "zh_tw";
        if (l.indexOf("zh") === 0) return "zh_cn";
        if (l.indexOf("pt") === 0) return "pt_br";
        var two = l.slice(0, 2);
        if (["en", "de", "fr", "es", "ru"].indexOf(two) >= 0) return two;
      }
      return "en";
    }
    location.replace(pick() + "/" + location.hash);
  })();
</script>
</head>
